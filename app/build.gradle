plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.giino.bydcontrol"
    compileSdk 34

    defaultConfig {
        applicationId "com.giino.bydcontrol"
        minSdk 28          // Dilink 3 = Android 9
        targetSdk 28       // keep legacy background/FGS behavior
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
    buildTypes {
        debug { }
        release { minifyEnabled false }
    }
}
dependencies {
    // BYD framework API: compile against the stubs, NOT packaged. The real
    // classes come from the device's system framework at runtime.
    compileOnly project(":bydsdk")
}
